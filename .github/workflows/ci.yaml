name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster (KinD)
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add Helm repositories
      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Step 4: Install MinIO for communal storage
      - name: Install MinIO (namespace minio)
        run: |
          kubectl create ns minio || true
          cat <<'EOF' > minio.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                  - name: minio
                    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
                    args: ["server", "/data"]
                    env:
                      - name: MINIO_ROOT_USER
                        value: "minio"
                      - name: MINIO_ROOT_PASSWORD
                        value: "miniopass"
                    ports:
                      - containerPort: 9000
                    volumeMounts:
                      - name: data
                        mountPath: /data
                volumes:
                  - name: data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: minio
          spec:
            selector:
              app: minio
            ports:
              - port: 9000
                targetPort: 9000
          EOF
          kubectl apply -f minio.yaml
          kubectl -n minio rollout status deployment/minio --timeout=2m || true
          kubectl get pods -n minio -o wide || true
          kubectl get svc -n minio || true

      # Step 5: Configure and install Vertica Operator
      - name: Install Vertica Operator (configure S3 endpoint)
        run: |
          NAMESPACE=my-verticadb-operator
          kubectl create ns ${NAMESPACE} || true
          cat <<'EOF' > operator-values.yaml
          installCRDs: true
          controller:
            extraEnv:
              - name: S3_ENDPOINT
                value: "http://minio.minio.svc.cluster.local:9000"
              - name: S3_USE_HTTPS
                value: "false"
              - name: S3_REGION
                value: "us-east-1"
              - name: S3_FORCE_PATH_STYLE
                value: "true"
              - name: AWS_REGION
                value: "us-east-1"
              - name: AWS_DEFAULT_REGION
                value: "us-east-1"
          EOF
          helm upgrade --install vdb-op vertica-charts/verticadb-operator \
            -n ${NAMESPACE} -f operator-values.yaml --wait --timeout 10m
          kubectl -n ${NAMESPACE} get pods -o wide || true
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=100 || true

      # Step 6: Create communal secret for Vertica
      - name: Create communal secret
        run: |
          NS=my-verticadb-operator
          kubectl create ns ${NS} || true
          kubectl create secret generic communal-creds \
            -n my-verticadb-operator \
            --from-literal=AWS_ACCESS_KEY_ID=minio \
            --from-literal=AWS_SECRET_ACCESS_KEY=miniopass \
            --from-literal=accesskey=minio \
            --from-literal=secretkey=miniopass
          kubectl get secret communal-creds -n ${NS} -o yaml || true

      # Step 7: Deploy MinIO (S3-compatible storage for communal path)
      - name: Deploy MinIO
        run: |
          echo "🪣 Deploying MinIO (S3-compatible communal storage)..."
          kubectl create namespace my-verticadb-operator --dry-run=client -o yaml | kubectl apply -f -
          cat <<'EOF' | kubectl apply -n my-verticadb-operator -f -
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
          spec:
            ports:
              - port: 9000
                targetPort: 9000
            selector:
              app: minio
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
          spec:
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                  - name: minio
                    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
                    args: ["server", "/data"]
                    env:
                      - name: MINIO_ROOT_USER
                        value: "minio"
                      - name: MINIO_ROOT_PASSWORD
                        value: "miniopass"
                    ports:
                      - containerPort: 9000
                    volumeMounts:
                      - name: data
                        mountPath: /data
                volumes:
                  - name: data
                    emptyDir: {}
          EOF

      # Step 8: Wait for MinIO readiness
      - name: Wait for MinIO
        run: |
          echo "🕓 Waiting for MinIO to become ready..."
          for i in {1..30}; do
            READY=$(kubectl get pods -n my-verticadb-operator -l app=minio -o jsonpath='{.items[0].status.containerStatuses[0].ready}' 2>/dev/null || echo "false")
            if [ "$READY" == "true" ]; then
              echo "✅ MinIO is ready!"
              kubectl get svc minio -n my-verticadb-operator
              break
            fi
            echo "⏳ MinIO not ready yet (attempt $i/30)..."
            sleep 10
          done
          if [ "$READY" != "true" ]; then
            echo "❌ MinIO never became ready. Showing logs..."
            kubectl logs -n my-verticadb-operator -l app=minio --tail=100
            exit 1
          fi

      # Step 9: Ensure MinIO bucket exists
      - name: Ensure MinIO bucket exists
        run: |
          kubectl run --rm -i --restart=Never mc \
            --image=minio/mc -n my-verticadb-operator --command -- \
            sh -c "mc alias set local http://minio.minio.svc.cluster.local:9000 minio miniopass >/dev/null 2>&1 && mc mb --ignore-existing local/vertica-bucket || true"

      # Step 10: Deploy VerticaDB
      - name: Deploy VerticaDB
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://vertica-bucket"
              endpoint: "http://minio.my-verticadb-operator.svc.cluster.local:9000"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF
          kubectl annotate verticadb verticadb-sample -n my-verticadb-operator vertica.com/ci-reconcile="$(date -u +%s)" --overwrite || true

      # Step 11: Wait for Vertica Operator and Pod readiness
      - name: Wait for Vertica Operator and Pod readiness
        run: |
          NS=my-verticadb-operator
          SS=verticadb-sample-defaultsubcluster
          POD=${SS}-0
          echo "Waiting for Vertica StatefulSet..."
          for i in {1..30}; do
            if kubectl get pod ${POD} -n ${NS} >/dev/null 2>&1; then
              echo "Pod exists"
              break
            fi
            sleep 10
          done
          kubectl wait --for=condition=Ready pod/${POD} -n ${NS} --timeout=5m || true
          kubectl get pods -n ${NS} -o wide || true

      # Step 12: Debug Vertica Pod State (always runs)
      - name: Debug Vertica Pod and Operator State
        if: always()
        run: |
          echo "🔎 Collecting Vertica pod logs and describe output..."
          kubectl describe pod verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=300 || true

          echo ""
          echo "🧩 Collecting Vertica Operator logs..."
          kubectl logs -n my-verticadb-operator -l app.kubernetes.io/name=verticadb-operator --tail=300 || \
          kubectl logs -n my-verticadb-operator verticadb-operator-manager-65986596dd-2jczc --tail=300 || true

          echo ""
          echo "📋 Listing all pods in namespace..."
          kubectl get pods -n my-verticadb-operator -o wide || true

          echo ""
          echo "🔍 Testing MinIO connectivity from inside cluster..."
          kubectl run s3-test --rm -i --restart=Never \
            --image=amazon/aws-cli:2.15.0 \
            -n my-verticadb-operator \
            --env AWS_ACCESS_KEY_ID=minio \
            --env AWS_SECRET_ACCESS_KEY=miniopass \
            --command -- bash -c \
            "aws --endpoint-url http://minio.my-verticadb-operator.svc.cluster.local:9000 s3 ls s3://vertica-bucket || echo '⚠️ MinIO not reachable inside cluster'" || true

          echo ""
