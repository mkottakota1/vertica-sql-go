name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # -----------------------
      # Minimal MinIO manifest
      # -----------------------
      - name: Install MinIO (minimal manifest, no PVCs)
        run: |
          kubectl create ns minio || true
          cat <<'EOF' > minio-manifest.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                - name: minio
                  image: minio/minio:RELEASE.2023-09-01T00-00-00Z
                  args: ["server", "/data"]
                  env:
                  - name: MINIO_ROOT_USER
                    value: "minio"
                  - name: MINIO_ROOT_PASSWORD
                    value: "miniopass"
                  ports:
                  - containerPort: 9000
                  volumeMounts:
                  - name: data
                    mountPath: /data
                volumes:
                - name: data
                  emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: minio
          spec:
            selector:
              app: minio
            ports:
            - port: 9000
              targetPort: 9000
            type: ClusterIP
          EOF

          kubectl apply -f minio-manifest.yaml
          for i in {1..30}; do
            POD=$(kubectl get pods -n minio -l app=minio -o name 2>/dev/null | head -n1 || true)
            if [ -n "$POD" ] && kubectl get $POD -n minio -o jsonpath='{.status.phase}' 2>/dev/null | grep -q Running; then
              echo "✅ MinIO Running ($POD)"
              break
            fi
            echo "Waiting for MinIO ($i/30)..."
            sleep 5
          done

          kubectl get pods -n minio -o wide || true
          kubectl get svc -n minio || true

      # -----------------------
      # Install Vertica Operator (opentext image) with S3 endpoint config
      # -----------------------
      - name: Install Vertica Operator (opentext image) with S3 endpoint config
        run: |
          RELEASE=vdb-op
          NAMESPACE=my-verticadb-operator
          IMAGE_REPO=opentext/verticadb-operator
          IMAGE_TAG=latest
          MINIO_ENDPOINT=http://minio.minio.svc.cluster.local:9000
          S3_REGION=us-east-1

          cat <<EOF > operator-values.yaml
          installCRDs: true
          image:
            repository: ${IMAGE_REPO}
            tag: ${IMAGE_TAG}
          controller:
            extraEnv:
              - name: S3_ENDPOINT
                value: "${MINIO_ENDPOINT}"
              - name: S3_REGION
                value: "${S3_REGION}"
              - name: S3_USE_HTTPS
                value: "false"
          EOF

          helm upgrade --install ${RELEASE} vertica-charts/verticadb-operator \
            --namespace ${NAMESPACE} --create-namespace \
            -f operator-values.yaml \
            --wait --timeout 10m

          kubectl get pods -n ${NAMESPACE} -o wide || true
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=50 || true

      # Create communal secret in Vertica namespace with MinIO creds
      - name: Create communal secret for Vertica
        run: |
          VERTICA_NS=my-verticadb-operator
          ACCESS_KEY=minio
          SECRET_KEY=miniopass

          kubectl create ns ${VERTICA_NS} || true
          kubectl create secret generic communal-creds -n ${VERTICA_NS} \
            --from-literal=AWS_ACCESS_KEY_ID=${ACCESS_KEY} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${SECRET_KEY} || true

          kubectl get secret communal-creds -n ${VERTICA_NS} -o yaml || true

      # Deploy VerticaDB pointing communal to MinIO
      - name: Deploy VerticaDB (communal -> MinIO)
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://vertica-bucket"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

      - name: Wait for VerticaCRD registration
        run: |
          for i in {1..30}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              echo "VerticaCRD present"
              break
            fi
            sleep 2
          done

      - name: Wait for VerticaDB pods to be ready
        run: |
          kubectl get pods -n my-verticadb-operator || true
          kubectl wait --for=condition=Ready pods --all -n my-verticadb-operator --timeout=900s || {
            echo "⚠️ Pods not all ready, showing details:"
            kubectl get pods -n my-verticadb-operator -o wide || true
            kubectl describe pods -n my-verticadb-operator || true
          }

      - name: Check VerticaDB Status and operator logs
        run: |
          kubectl get verticadb -n my-verticadb-operator -o yaml || true
          kubectl describe verticadb verticadb-sample -n my-verticadb-operator || true
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=200 || true

      - name: Wait for Vertica service
        run: |
          echo "Waiting for Vertica service to appear..."
          for i in {1..30}; do
            if kubectl get svc verticadb-sample -n my-verticadb-operator >/dev/null 2>&1; then
              echo "Vertica service found"
              break
            fi
            sleep 10
          done

          if ! kubectl get svc verticadb-sample -n my-verticadb-operator >/dev/null 2>&1; then
            echo "Vertica service did not appear; dumping debug:"
            kubectl get svc -n my-verticadb-operator || true
            kubectl get pods -n my-verticadb-operator || true
            kubectl describe verticadb verticadb-sample -n my-verticadb-operator || true
            exit 1
          fi

      - name: Run Vertica SQL Go tests inside cluster
        run: |
         kubectl run go-test-runner \
         --rm -i --restart=Never \
         --image=golang:1.20 \
      --namespace=my-verticadb-operator \
      -- bash -c "
        git clone https://github.com/mkottakota1/vertica-sql-go /src;
        cd /src;
        go test ./... -v -args \
          --locator verticadb-sample-defaultsubcluster.my-verticadb-operator.svc.cluster.local:5433 \
          --user dbadmin
      "
