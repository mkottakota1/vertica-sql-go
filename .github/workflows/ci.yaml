name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster (KinD)
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add Helm repositories
      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update
      # Step 4: Install Vertica Operator (AWS S3 mode)
      - name: Install Vertica Operator
        run: |
          NAMESPACE=my-verticadb-operator
          kubectl create ns ${NAMESPACE} || true
          cat <<'EOF' > operator-values.yaml
          installCRDs: true
          controller:
            extraEnv:
              - name: AWS_REGION
                value: "us-east-1"
              - name: AWS_DEFAULT_REGION
                value: "us-east-1"
          EOF
          helm upgrade --install vdb-op vertica-charts/verticadb-operator \
            -n ${NAMESPACE} -f operator-values.yaml --wait --timeout 10m
          kubectl -n ${NAMESPACE} get pods -o wide || true
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=100 || true
      # Step 5: Create AWS S3 credentials as Kubernetes secret
      - name: Create AWS S3 Secret
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          kubectl delete secret communal-creds -n my-verticadb-operator --ignore-not-found
          kubectl create secret generic communal-creds \
            -n my-verticadb-operator \
            --from-literal=AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}" \
            --from-literal=accesskey="${AWS_ACCESS_KEY_ID}" \
            --from-literal=secretkey="${AWS_SECRET_ACCESS_KEY}"
          echo "✅ Created AWS secret communal-creds"
          kubectl get secret communal-creds -n my-verticadb-operator -o yaml || true
      # Step 7: Deploy VerticaDB using AWS S3
      - name: Deploy VerticaDB
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: s3://vertica-fleeting/mkottakota/
              credentialSecret: communal-creds
              region: us-east-1
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF
          kubectl annotate verticadb verticadb-sample -n my-verticadb-operator \
            vertica.com/ci-reconcile="$(date -u +%s)" --overwrite || true
      # Step 8: Wait for Vertica readiness
      - name: Wait for Vertica Operator and Pod readiness
        run: |
          NS=my-verticadb-operator
          SS=verticadb-sample-defaultsubcluster
          POD=${SS}-0
          echo "🕓 Waiting for Vertica StatefulSet..."
          for i in {1..30}; do
            if kubectl get pod ${POD} -n ${NS} >/dev/null 2>&1; then
              echo "✅ Pod exists"
              break
            fi
            sleep 10
          done
          kubectl wait --for=condition=Ready pod/${POD} -n ${NS} --timeout=5m || true
          kubectl get pods -n ${NS} -o wide || true
      # Step 9: Debug Vertica pod and operator on failure
      - name: Debug Vertica Pod and Operator State
        if: always()
        run: |
          echo "🔎 Collecting Vertica pod logs and describe output..."
          kubectl describe pod verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=300 || true
          echo ""
          echo "🧩 Collecting Vertica Operator logs..."
          kubectl logs -n my-verticadb-operator -l app.kubernetes.io/name=verticadb-operator --tail=300 || \
          kubectl logs -n my-verticadb-operator verticadb-operator-manager-65986596dd-2jczc --tail=300 || true
          echo ""
          kubectl get pods -n my-verticadb-operator -o wide || true
          echo ""
          echo "🔍 Testing AWS S3 connectivity from inside cluster..."
          kubectl run s3-test --rm -i --restart=Never \
            --image=amazon/aws-cli:2.15.0 \
            -n my-verticadb-operator \
            --command -- bash -c "aws s3 ls s3://vertica-fleeting/mkottakota --region us-east-1" || true
          echo ""
          echo "✅ Debug collection complete — see above logs for Vertica and Operator behavior."
      # Step 10: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          NS=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          LOCATOR="${SVC}.${NS}.svc.cluster.local:5433"
          WAIT_TIMEOUT=300
          INTERVAL=5
          echo "Waiting for Service ${SVC} endpoints to be populated..."
          deadline=$((SECONDS + WAIT_TIMEOUT))
          while [ $SECONDS -lt $deadline ]; do
            addrs=$(kubectl -n ${NS} get endpoints ${SVC} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            if [ -n "$addrs" ]; then
              echo "Found endpoints: ${addrs}"
              break
            fi
            echo "no endpoints yet; sleeping ${INTERVAL}s"
            sleep ${INTERVAL}
          done
          if [ -z "$addrs" ]; then
            echo "ERROR: Service ${SVC} has no endpoints after ${WAIT_TIMEOUT}s"
            kubectl -n ${NS} get svc ${SVC} -o wide || true
            kubectl -n ${NS} get endpoints ${SVC} -o yaml || true
            exit 1
          fi
          echo "Probing TCP 5433 on service DNS ${LOCATOR} from inside cluster..."
          probe_ok=0
          deadline=$((SECONDS + WAIT_TIMEOUT))
          while [ $SECONDS -lt $deadline ]; do
            kubectl -n ${NS} run --rm -i --restart=Never tmp-netcheck --image=busybox -- /bin/sh -c "nc -z -w3 ${LOCATOR%%:*} ${LOCATOR##*:}" && probe_ok=1 && break
            echo "TCP probe failed; retrying in ${INTERVAL}s"
            sleep ${INTERVAL}
          done
          if [ "${probe_ok}" != "1" ]; then
            echo "WARNING: Service TCP probe to ${LOCATOR} failed. Dumping diagnostics."
            kubectl -n ${NS} get endpoints ${SVC} -o yaml || true
            for ip in $addrs; do
              echo "---- testing pod IP ${ip}:5433 ----"
              kubectl -n ${NS} run --rm -i --restart=Never tmp-nc-${ip//./-} --image=busybox -- /bin/sh -c "nc -z -w3 ${ip} 5433" || true
            done
            exit 1
          fi
          echo "✅ TCP 5433 reachable at ${LOCATOR}. Running Vertica SQL Go tests inside cluster..."
          # Create Go test runner pod
          kubectl -n ${NS} run go-test-runner \
            --image=golang:1.20 \
            --restart=Never -- sleep infinity
          kubectl -n ${NS} wait --for=condition=Ready pod/go-test-runner --timeout=120s
          # Copy Go source into pod
          echo "Copying Go source into pod..."
          kubectl -n ${NS} exec -i go-test-runner -- mkdir -p /workspace
          tar cf - . --warning=no-file-changed | kubectl -n ${NS} exec -i go-test-runner -- tar xf - -C /workspace
          # Run Go tests inside pod
          kubectl -n ${NS} exec -i go-test-runner -- bash -c "
            set -euo pipefail
            cd /workspace
            go mod tidy
            # Run main tests that need flags
            go test -v -race . -args --locator ${LOCATOR} --user dbadmin

           # Run all other subpackages ignoring flags
           for pkg in $(go list ./... | grep -v 'github.com/vertica/vertica-sql-go$'); do
             go test -v -race "$pkg"
           done

          "
          # Clean up pod
          kubectl -n ${NS} delete pod go-test-runner --ignore-not-found=true
      # Step 11: Final Diagnostics
      - name: Save final diagnostics
        if: always()
        run: |
          kubectl get pods -n my-verticadb-operator -o wide || true
          kubectl get svc -n my-verticadb-operator -o wide || true
          kubectl get endpoints -n my-verticadb-operator || true
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=500 || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=500 || true
