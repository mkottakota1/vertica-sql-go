name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster (KinD)
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add Helm repositories
      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Step 4: Configure and install Vertica Operator
      - name: Install Vertica Operator (configure S3 endpoint)
        run: |
          NAMESPACE=my-verticadb-operator
          kubectl create ns ${NAMESPACE} || true

          cat <<EOF > operator-values.yaml
          installCRDs: true
          controller:
            extraEnv:
              - name: S3_ENDPOINT
                value: "http://10.5.244.42:9000"
              - name: S3_USE_HTTPS
                value: "false"
              - name: S3_REGION
                value: "us-east-1"
              - name: S3_FORCE_PATH_STYLE
                value: "true"
              - name: AWS_REGION
                value: "us-east-1"
              - name: AWS_DEFAULT_REGION
                value: "us-east-1"
          EOF

          helm upgrade --install vdb-op vertica-charts/verticadb-operator \
            -n ${NAMESPACE} -f operator-values.yaml --wait --timeout 10m

          kubectl -n ${NAMESPACE} get pods -o wide || true
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=100 || true

      # Step 5: Create communal secret for Vertica
      - name: Create communal secret
        run: |
          NS=my-verticadb-operator
          kubectl create ns ${NS} || true
          kubectl create secret generic communal-creds \
            -n ${NS} \
            --from-literal=AWS_ACCESS_KEY_ID=minioadmin \
            --from-literal=AWS_SECRET_ACCESS_KEY=minioadmin \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl get secret communal-creds -n ${NS} -o yaml || true

      # Step 6: Ensure MinIO bucket exists
      - name: Ensure MinIO bucket exists
        run: |
          kubectl run --rm -i --restart=Never mc \
            --image=minio/mc -n my-verticadb-operator --command -- \
            sh -c "mc alias set local http://10.5.244.42:9000 minioadmin minioadmin >/dev/null 2>&1 && mc mb --ignore-existing local/vertica-bucket || true"

      # Step 7: Deploy VerticaDB (with endpoint)
      - name: Deploy VerticaDB
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://vertica-bucket"
              endpoint: "http://10.5.244.42:9000"
              credentialSecret: communal-creds
              region: "us-east-1"
              useHTTP: true
              usePathStyle: true
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

          kubectl annotate verticadb verticadb-sample -n my-verticadb-operator \
            vertica.com/ci-reconcile="$(date -u +%s)" --overwrite || true

      # Step 8: Wait for Vertica readiness
      - name: Wait for Vertica Pods
        run: |
          NS=my-verticadb-operator
          echo "⏳ Waiting for Vertica pods to start..."
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/component=database \
            -n ${NS} --timeout=600s || true
          kubectl get pods -n ${NS} -o wide || true

      # Step 9: Debug Vertica Pod State
      - name: Debug Vertica Pod State
        if: always()
        run: |
          echo "🔎 Collecting Vertica pod logs and describe output..."
          kubectl describe pod verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=300 || true
          echo "🔍 Testing MinIO S3 connectivity..."
          kubectl run s3-test --rm -i --restart=Never \
            --image=amazon/aws-cli:2.15.0 \
            -n my-verticadb-operator \
            --env AWS_ACCESS_KEY_ID=minioadmin \
            --env AWS_SECRET_ACCESS_KEY=minioadmin \
            --command -- aws s3 ls s3://vertica-bucket --endpoint-url http://10.5.244.42:9000 --region us-east-1 || true

      # Step 10: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests inside cluster
        run: |
          kubectl run go-test-runner \
            --rm -i --restart=Never \
            --image=golang:1.20 \
            --namespace=my-verticadb-operator \
            -- bash -c "$(cat <<'EOS'
          set -e
          git clone https://github.com/mkottakota1/vertica-sql-go /src || true
          cd /src
          go test ./... -v -args \
            --locator verticadb-sample-defaultsubcluster.my-verticadb-operator.svc.cluster.local:5433 \
            --user dbadmin
          EOS
          )"

      # Step 11: Save diagnostics
      - name: Save final diagnostics (always)
        if: always()
        run: |
          echo "🧩 Collecting final diagnostics..."
          NS=my-verticadb-operator
          kubectl get pods -n ${NS} -o wide || true
          kubectl get svc -n ${NS} -o wide || true
          kubectl get endpoints -n ${NS} || true
          kubectl logs -n ${NS} -l control-plane=controller-manager --tail=500 || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n ${NS} --all-containers --tail=500 || true
          echo "✅ Debug collection complete"
