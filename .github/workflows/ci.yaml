name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Set up Kubernetes cluster
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add Helm repos
      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Step 4: Install MinIO
      - name: Install MinIO (namespace minio)
        run: |
          kubectl create ns minio || true
          cat <<'EOF' > minio.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                - name: minio
                  image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
                  args: ["server", "/data"]
                  env:
                  - name: MINIO_ROOT_USER
                    value: "minio"
                  - name: MINIO_ROOT_PASSWORD
                    value: "miniopass"
                  ports:
                  - containerPort: 9000
                  volumeMounts:
                  - name: data
                    mountPath: /data
                volumes:
                - name: data
                  emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: minio
          spec:
            selector:
              app: minio
            ports:
            - port: 9000
              targetPort: 9000
          EOF
          kubectl apply -f minio.yaml
          echo "🕓 Waiting for MinIO to become ready..."
          kubectl -n minio rollout status deployment/minio --timeout=2m || true
          kubectl get pods -n minio -o wide
          kubectl get svc -n minio -o wide

      # Step 5: Install Vertica Operator with S3 endpoint
      - name: Install Vertica Operator (configure S3 endpoint)
        run: |
          NAMESPACE=my-verticadb-operator
          kubectl create ns ${NAMESPACE} || true
          cat <<EOF > operator-values.yaml
          installCRDs: true
          controller:
            extraEnv:
              - name: S3_ENDPOINT
                value: "http://minio.minio.svc.cluster.local:9000"
              - name: S3_USE_HTTPS
                value: "false"
              - name: S3_REGION
                value: "us-east-1"
              - name: S3_FORCE_PATH_STYLE
                value: "true"
              - name: AWS_REGION
                value: "us-east-1"
              - name: AWS_DEFAULT_REGION
                value: "us-east-1"
          EOF
          helm upgrade --install vdb-op vertica-charts/verticadb-operator -n ${NAMESPACE} -f operator-values.yaml --wait --timeout 10m
          kubectl -n ${NAMESPACE} get pods -o wide
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=100 || true

      # Step 6: Create communal secret (both key formats)
      - name: Create communal secret for Vertica
        run: |
          NS=my-verticadb-operator
          ACCESS_KEY=minio
          SECRET_KEY=miniopass
          kubectl create ns ${NS} || true
          kubectl delete secret communal-creds -n ${NS} --ignore-not-found=true || true
          kubectl create secret generic communal-creds -n ${NS} \
            --from-literal=AWS_ACCESS_KEY_ID="${ACCESS_KEY}" \
            --from-literal=AWS_SECRET_ACCESS_KEY="${SECRET_KEY}" \
            --from-literal=accesskey="${ACCESS_KEY}" \
            --from-literal=secretkey="${SECRET_KEY}"
          kubectl get secret communal-creds -n ${NS} -o yaml || true

      # Step 7: Ensure MinIO bucket exists
      - name: Ensure MinIO bucket exists
        run: |
          kubectl run --rm -i --restart=Never mc --image=minio/mc -n my-verticadb-operator --command -- \
            sh -c "mc alias set local http://minio.minio.svc.cluster.local:9000 minio miniopass >/dev/null 2>&1 && mc mb --ignore-existing local/vertica-bucket && mc ls local"

      # Step 8: Deploy VerticaDB
      - name: Deploy VerticaDB
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://vertica-bucket"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF
          kubectl annotate verticadb verticadb-sample -n my-verticadb-operator vertica.com/ci-reconcile="$(date -u +%s)" --overwrite || true

      # Step 9: Wait for operator and Vertica pods
      - name: Wait for operator and Vertica pods
        run: |
          kubectl wait --for=condition=Ready pods -l control-plane=controller-manager -n my-verticadb-operator --timeout=10m || true
          kubectl get pods -n my-verticadb-operator -o wide

      # Step 10: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          NS=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          LOCATOR="${SVC}.${NS}.svc.cluster.local:5433"
          echo "Waiting for Service ${SVC} endpoints..."
          for i in {1..60}; do
            if kubectl -n ${NS} get endpoints ${SVC} -o jsonpath='{.subsets[*].addresses[*].ip}' | grep -q .; then
              echo "✅ Vertica endpoints ready"
              break
            fi
            sleep 5
          done
          echo "Launching Go test runner..."
          kubectl -n ${NS} run go-test-runner --image=golang:1.20 --restart=Never -- sleep infinity
          kubectl -n ${NS} wait --for=condition=Ready pod/go-test-runner --timeout=120s
          kubectl -n ${NS} exec -i go-test-runner -- bash -c "
            set -e
            mkdir -p /workspace
            cd /workspace
            tar xf - < /dev/stdin
          " < <(tar cf - .)
          kubectl -n ${NS} exec -i go-test-runner -- bash -c "
            set -e
            cd /workspace
            go mod tidy
            echo 'Running Go tests against ${LOCATOR}...'
            go test -v -race . -args --locator ${LOCATOR} --user dbadmin
          "

      # Step 11: Always collect diagnostics
      - name: Collect final diagnostics
        if: always()
        run: |
          kubectl get pods -n my-verticadb-operator -o wide || true
          kubectl get svc -n my-verticadb-operator -o wide || true
          kubectl get endpoints -n my-verticadb-operator || true
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=500 || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=500 || true
