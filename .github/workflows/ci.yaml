name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Set up Kubernetes cluster
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3

      # Step 3: Add Vertica Helm repo
      - name: Add Vertica Helm repo
        run: |
          for i in {1..3}; do
            helm repo add vertica-charts https://vertica.github.io/charts && break
            echo "Retrying helm repo add..."
            sleep 5
          done
          helm repo update

      # Step 4: Install Vertica Operator (includes CRDs)
      - name: Install Vertica Operator via Helm
        run: |
          echo "📦 Installing Vertica Operator via Helm..."
          helm install vdb-op vertica-charts/verticadb-operator \
            --namespace my-verticadb-operator \
            --create-namespace \
            --set installCRDs=true \
            --wait

      # Step 5: Wait for Vertica CRD
      - name: Wait for Vertica CRD
        run: |
          echo "⏳ Waiting for VerticaDB CRD registration..."
          for i in {1..30}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              echo "✅ VerticaDB CRD is registered!"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 5
          done

      # Step 6: Create communal secret for Vertica
      - name: Create communal secret
        run: |
          NS=my-verticadb-operator
          kubectl create ns ${NS} || true
          kubectl delete secret communal-creds -n ${NS} --ignore-not-found
          kubectl create secret generic communal-creds \
            -n ${NS} \
            --from-literal=AWS_ACCESS_KEY_ID=minio \
            --from-literal=AWS_SECRET_ACCESS_KEY=miniopass
          kubectl get secret communal-creds -n ${NS} -o yaml

      # Step 7: Deploy VerticaDB
      - name: Deploy VerticaDB
        run: |
          echo "🚀 Deploying VerticaDB with MinIO communal path..."
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://dummy-bucket"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

      # Step 8: Wait for VerticaDB pods to be ready
      - name: Wait for VerticaDB pods
        run: |
          echo "⏳ Waiting for VerticaDB pods to start..."
          kubectl get pods -n my-verticadb-operator
          kubectl wait --for=condition=Ready pods --all -n my-verticadb-operator --timeout=600s || {
            echo "⚠️ Pods not all ready, showing details:"
            kubectl get pods -n my-verticadb-operator -o wide
            kubectl describe pods -n my-verticadb-operator
          }

      - name: Check Vertica readiness
        run: |
          echo "🧠 Checking Vertica container health..."
          POD=$(kubectl get pods -n my-verticadb-operator -l app.kubernetes.io/name=vertica -o jsonpath='{.items[0].metadata.name}' || echo "")
          if [ -z "$POD" ]; then
            echo "❌ No Vertica pods found. Listing for debug..."
            kubectl get pods -n my-verticadb-operator
            exit 1
          fi
          echo "📦 Checking pod: $POD"
          for i in {1..30}; do
            if kubectl exec -n my-verticadb-operator $POD -c nma -- curl -sk http://localhost:8080/v2/health | grep -q "UP"; then
              echo "✅ Vertica is healthy and responding!"
              break
            fi
            echo "⏳ Vertica still starting... ($i/30)"
            sleep 10
          done


      # Step 10: Verify Vertica version
      - name: Check Vertica version
        run: |
          echo "🔍 Checking Vertica version..."
          POD=$(kubectl get pods -n my-verticadb-operator -l app.kubernetes.io/name=vertica -o jsonpath='{.items[0].metadata.name}' || echo "")
          if [ -z "$POD" ]; then
            echo "❌ No Vertica pods found. Listing for debug..."
            kubectl get pods -n my-verticadb-operator
            exit 1
          fi
          echo "📦 Running version query on $POD"
          kubectl exec -n my-verticadb-operator $POD -c server -- bash -c "/opt/vertica/bin/vsql -U dbadmin -c 'SELECT version();'"


      # Step 11: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          echo "🧪 Running Go tests against Vertica..."
          go test ./... -v
