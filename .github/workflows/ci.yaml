name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster (KinD)
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Install Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add repositories
      - name: Add Helm repos
        run: |
          helm repo add vertica https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Step 4: Deploy MinIO (S3 replacement)
      - name: Install MinIO
        run: |
          kubectl create ns minio || true
          cat <<'EOF' > minio.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                  - name: minio
                    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
                    args: ["server", "/data"]
                    env:
                      - name: MINIO_ROOT_USER
                        value: "minio"
                      - name: MINIO_ROOT_PASSWORD
                        value: "miniopass"
                    ports:
                      - containerPort: 9000
                    volumeMounts:
                      - name: data
                        mountPath: /data
                volumes:
                  - name: data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: minio
          spec:
            selector:
              app: minio
            ports:
              - port: 9000
                targetPort: 9000
          EOF

          kubectl apply -f minio.yaml
          kubectl -n minio rollout status deployment/minio --timeout=2m || true
          kubectl get pods -n minio -o wide || true
          kubectl get svc -n minio || true

      # Step 5: Install Vertica Operator (with fallback)
      - name: Install Vertica Operator
        run: |
          NAMESPACE=my-verticadb-operator
          kubectl create ns ${NAMESPACE} || true

          cat <<EOF > operator-values.yaml
          installCRDs: true
          controller:
            extraEnv:
              - name: AWS_REGION
                value: "us-east-1"
              - name: AWS_DEFAULT_REGION
                value: "us-east-1"
              - name: S3_ENDPOINT
                value: "http://minio.minio.svc.cluster.local:9000"
              - name: S3_USE_HTTPS
                value: "false"
              - name: S3_REGION
                value: "us-east-1"
              - name: S3_FORCE_PATH_STYLE
                value: "true"
          EOF

          echo "Installing Vertica operator via Helm..."
          if ! helm upgrade --install vdb-op vertica/verticadb-operator -n ${NAMESPACE} -f operator-values.yaml --wait --timeout 10m; then
            echo "⚠️ Helm install failed — applying operator manually..."
            kubectl apply -f https://raw.githubusercontent.com/vertica/vertica-kubernetes/main/config/deployments/operator.yaml -n ${NAMESPACE}
          fi

          kubectl -n ${NAMESPACE} get pods -o wide || true

      # Step 6: Wait for operator to be ready
      - name: Wait for operator ready
        run: |
          kubectl wait --for=condition=Ready pods -l control-plane=controller-manager -n my-verticadb-operator --timeout=10m || true

      # Step 7: Create communal secret for MinIO
      - name: Create communal secret for Vertica
        run: |
          NS=my-verticadb-operator
          ACCESS_KEY=minio
          SECRET_KEY=miniopass
          kubectl create secret generic communal-creds -n ${NS} \
            --from-literal=AWS_ACCESS_KEY_ID=${ACCESS_KEY} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${SECRET_KEY} \
            --from-literal=accesskey=${ACCESS_KEY} \
            --from-literal=secretkey=${SECRET_KEY} || true
          kubectl get secret communal-creds -n ${NS} -o yaml || true

      # Step 8: Create MinIO bucket for Vertica
      - name: Ensure MinIO bucket exists
        run: |
          kubectl run --rm -i --restart=Never mc \
            --image=minio/mc -n my-verticadb-operator --command -- \
            sh -c "mc alias set local http://minio.minio.svc.cluster.local:9000 minio miniopass >/dev/null 2>&1 && mc mb --ignore-existing local/vertica-bucket"

      # Step 9: Deploy VerticaDB using MinIO endpoint
      - name: Deploy VerticaDB
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: s3://vertica-bucket
              credentialSecret: communal-creds
              region: us-east-1
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF
          kubectl annotate verticadb verticadb-sample -n my-verticadb-operator vertica.com/ci-reconcile="$(date -u +%s)" --overwrite || true

      # Step 10: Wait for Vertica pods ready
      - name: Wait for Vertica pods
        run: |
          kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=verticadb -n my-verticadb-operator --timeout=20m || true
          kubectl get pods -n my-verticadb-operator -o wide || true

      # Step 11: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests inside cluster
        run: |
          kubectl run go-test-runner \
            --rm -i --restart=Never \
            --image=golang:1.20 \
            --namespace=my-verticadb-operator \
            -- bash -c "$(cat <<'EOS'
          set -e
          git clone https://github.com/mkottakota1/vertica-sql-go /src || true
          cd /src
          go mod tidy
          go test ./... -v -args \
            --locator verticadb-sample-defaultsubcluster.my-verticadb-operator.svc.cluster.local:5433 \
            --user dbadmin
          EOS
          )"

      # Step 12: Save diagnostics always
      - name: Save final diagnostics (always)
        if: always()
        run: |
          kubectl get pods -n my-verticadb-operator -o wide || true
          kubectl get svc -n my-verticadb-operator -o wide || true
          kubectl get endpoints -n my-verticadb-operator || true
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=500 || true
