name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # -----------------------
      # Minimal MinIO manifest
      # -----------------------
      - name: Install MinIO (minimal manifest, no PVCs)
        run: |
          kubectl create ns minio || true
          cat <<'EOF' > minio-manifest.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                - name: minio
                  image: minio/minio:RELEASE.2023-09-01T00-00-00Z
                  args: ["server", "/data"]
                  env:
                  - name: MINIO_ROOT_USER
                    value: "minio"
                  - name: MINIO_ROOT_PASSWORD
                    value: "miniopass"
                  ports:
                  - containerPort: 9000
                  volumeMounts:
                  - name: data
                    mountPath: /data
                volumes:
                - name: data
                  emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: minio
          spec:
            selector:
              app: minio
            ports:
            - port: 9000
              targetPort: 9000
            type: ClusterIP
          EOF

          kubectl apply -f minio-manifest.yaml
          for i in {1..30}; do
            POD=$(kubectl get pods -n minio -l app=minio -o name 2>/dev/null | head -n1 || true)
            if [ -n "$POD" ] && kubectl get $POD -n minio -o jsonpath='{.status.phase}' 2>/dev/null | grep -q Running; then
              echo "✅ MinIO Running ($POD)"
              break
            fi
            echo "Waiting for MinIO ($i/30)..."
            sleep 5
          done

          kubectl get pods -n minio -o wide || true
          kubectl get svc -n minio || true

      # -----------------------
      # Install Vertica Operator (opentext image) with S3 endpoint config
      # -----------------------
      - name: Install Vertica Operator (opentext image) with S3 endpoint config
        run: |
          RELEASE=vdb-op
          NAMESPACE=my-verticadb-operator
          IMAGE_REPO=opentext/verticadb-operator
          IMAGE_TAG=latest
          MINIO_ENDPOINT=http://minio.minio.svc.cluster.local:9000
          S3_REGION=us-east-1

          cat <<EOF > operator-values.yaml
          installCRDs: true
          image:
            repository: ${IMAGE_REPO}
            tag: ${IMAGE_TAG}
          controller:
            extraEnv:
              - name: S3_ENDPOINT
                value: "${MINIO_ENDPOINT}"
              - name: S3_REGION
                value: "${S3_REGION}"
              - name: S3_USE_HTTPS
                value: "false"
          EOF

          helm upgrade --install ${RELEASE} vertica-charts/verticadb-operator \
            --namespace ${NAMESPACE} --create-namespace \
            -f operator-values.yaml \
            --wait --timeout 10m

          kubectl get pods -n ${NAMESPACE} -o wide || true
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=50 || true

      # Create communal secret in Vertica namespace with MinIO creds
      - name: Create communal secret for Vertica (operator key names)
        run: |
          VERTICA_NS=my-verticadb-operator
          ACCESS_KEY=minio
          SECRET_KEY=miniopass

          kubectl create ns ${VERTICA_NS} || true
          kubectl delete secret communal-creds -n ${VERTICA_NS} --ignore-not-found=true || true
          kubectl create secret generic communal-creds -n ${VERTICA_NS} \
            --from-literal=accesskey=${ACCESS_KEY} \
            --from-literal=secretkey=${SECRET_KEY}

          kubectl get secret communal-creds -n ${VERTICA_NS} -o yaml || true

      - name: Ensure MinIO bucket exists (awscli pod)
        run: |
          kubectl run --rm -i --restart=Never awscli --image=amazon/aws-cli -n my-verticadb-operator --command -- \
          sh -c 'aws --endpoint-url http://minio.minio.svc.cluster.local:9000 s3api create-bucket --bucket vertica-bucket || true'

      # Deploy VerticaDB pointing communal to MinIO
      - name: Deploy VerticaDB (communal -> MinIO)
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://vertica-bucket"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

      - name: Trigger operator reconcile (annotate CR)
        run: |
          kubectl annotate verticadb verticadb-sample -n my-verticadb-operator \
            vertica.com/ci-reconcile="$(date -u +%s)" --overwrite || true

      - name: Wait for VerticaCRD registration
        run: |
          for i in {1..30}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              echo "VerticaCRD present"
              break
            fi
            sleep 2
          done

      - name: Wait for VerticaDB pods to be created
        run: |
          kubectl get pods -n my-verticadb-operator || true

      - name: Check VerticaDB Status and operator logs
        run: |
          kubectl get verticadb -n my-verticadb-operator -o yaml || true
          kubectl describe verticadb verticadb-sample -n my-verticadb-operator || true
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=200 || true

      - name: Wait for operator controller ready
        run: |
          kubectl wait --for=condition=Ready pods -l control-plane=controller-manager -n my-verticadb-operator --timeout=10m || true

      - name: Wait for Vertica pod to start (long timeout)
        run: |
          echo "Waiting for vertica pod startup (20m)..."
          kubectl wait --for=condition=Ready pod/verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --timeout=20m || {
            echo "Timed out waiting for pod Ready; collecting diagnostics..."
            kubectl get pods -n my-verticadb-operator -o wide || true
            kubectl describe pod verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator || true
            kubectl get events -n my-verticadb-operator --sort-by='.lastTimestamp' | tail -n50 || true
            kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=500 || true
            kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=500 || true
            # show whether startup.json exists and some startup log
            kubectl exec -n my-verticadb-operator verticadb-sample-defaultsubcluster-0 -c server -- sh -c 'ls -la /tmp/startup /opt/vertica/log || true; if [ -f /tmp/startup/startup.json ]; then echo "=== startup.json ==="; sed -n "1,200p" /tmp/startup/startup.json || true; else echo "startup.json missing"; fi' || true
            exit 1
          }

      - name: Wait for Vertica service endpoints
        run: |
          for i in {1..60}; do
            if kubectl get endpoints -n my-verticadb-operator verticadb-sample-defaultsubcluster -o jsonpath='{.subsets[*].addresses[*].ip}' | grep -q .; then
              echo "✅ Vertica endpoints present"
              break
            fi
            echo "Waiting for Vertica endpoints ($i/60)..."
            sleep 10
          done
          # If still none, dump diagnostics
          if ! kubectl get endpoints -n my-verticadb-operator verticadb-sample-defaultsubcluster -o jsonpath='{.subsets[*].addresses[*].ip}' | grep -q .; then
            echo "No endpoints after wait; dumping debugging info"
            kubectl get svc -n my-verticadb-operator -o wide || true
            kubectl describe svc verticadb-sample-defaultsubcluster -n my-verticadb-operator || true
            kubectl get pods -n my-verticadb-operator -o wide || true
            kubectl describe pod verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator || true
            kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=500 || true
            kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=500 || true
            exit 1
          fi

      - name: Collect server logs and startup.json (for record)
        run: |
          kubectl logs verticadb-sample-defaultsubcluster-0 -c server -n my-verticadb-operator --tail=500 || true
          kubectl exec -n my-verticadb-operator verticadb-sample-defaultsubcluster-0 -c server -- \
            sh -c 'ls -la /tmp/startup /opt/vertica/log || true; if [ -f /tmp/startup/startup.json ]; then echo "=== startup.json ==="; sed -n "1,200p" /tmp/startup/startup.json || true; fi' || true

      - name: Test MinIO reachability and list buckets
        run: |
          kubectl run --rm -i --restart=Never curlpod --image=radial/busyboxplus:curl -n my-verticadb-operator -- \
            sh -c 'curl -sS http://minio.minio.svc.cluster.local:9000/ && echo "minio reachable" || echo "minio unreachable"' || true
          kubectl run --rm -i --restart=Never awscli --image=amazon/aws-cli -n my-verticadb-operator -- \
            aws --endpoint-url http://minio.minio.svc.cluster.local:9000 s3api list-buckets || true

      - name: Probe server health endpoint
        run: |
          kubectl exec -n my-verticadb-operator verticadb-sample-defaultsubcluster-0 -c server -- \
            sh -c 'curl -sS -w "HTTP=%{http_code}\n" http://127.0.0.1:8080/v2/health || echo "health probe failed"' || true

      - name: Save final diagnostics if tests will run (non-fatal)
        if: always()
        run: |
          kubectl get pods -n my-verticadb-operator -o wide || true
          kubectl get svc -n my-verticadb-operator -o wide || true
          kubectl get endpoints -n my-verticadb-operator || true

      - name: Debug Vertica pods and services
        run: |
         kubectl get pods -n my-verticadb-operator -o wide
         kubectl describe pod -n my-verticadb-operator verticadb-sample-defaultsubcluster-0 || true
         kubectl logs -n my-verticadb-operator verticadb-sample-defaultsubcluster-0 --all-containers --tail=200 || true
         kubectl get svc -n my-verticadb-operator -o wide
         kubectl describe svc -n my-verticadb-operator verticadb-sample-defaultsubcluster || true

      - name: Run Vertica SQL Go tests inside cluster
        run: |
          kubectl run go-test-runner \
          --rm -i --restart=Never \
          --image=golang:1.20 \
          --namespace=my-verticadb-operator \
          -- bash -c "$(cat <<'EOF'
            set -e
            git clone https://github.com/mkottakota1/vertica-sql-go /src || true
            cd /src || true
            go test ./... -v -args \
              --locator verticadb-sample-defaultsubcluster.my-verticadb-operator.svc.cluster.local:5433 \
              --user dbadmin
          EOF
          )"
