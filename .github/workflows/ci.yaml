name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Set up Kubernetes cluster (KinD)
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3

      # Step 3: Add Vertica Helm repo
      - name: Add Vertica Helm repo
        run: |
          for i in {1..3}; do
            helm repo add vertica-charts https://vertica.github.io/charts && break
            echo "Retrying helm repo add..."
            sleep 5
          done
          helm repo update
      - name: Install Vertica CRDs
        run: |
          echo "Installing Vertica CRDs..."
          kubectl create namespace my-verticadb-operator || true
          kubectl apply -f https://raw.githubusercontent.com/vertica/vertica-kubernetes/main/deploy/crds/verticadb.vertica.com_verticadbs.yaml
          kubectl apply -f https://raw.githubusercontent.com/vertica/vertica-kubernetes/main/deploy/crds/verticadb.vertica.com_verticaautoscalers.yaml
          kubectl apply -f https://raw.githubusercontent.com/vertica/vertica-kubernetes/main/deploy/crds/verticadb.vertica.com_verticadboperators.yaml
          echo "Verifying CRDs..."
          kubectl get crds | grep vertica

      # Step 5: Install Vertica Operator via Helm
      - name: Install Vertica Operator
        run: |
          helm install vdb-op vertica-charts/verticadb-operator \
            --namespace my-verticadb-operator \
            --create-namespace \
            --wait

      # Step 6: Wait for CRDs (in case Helm overwrites)
      - name: Wait for Vertica CRDs
        run: |
          echo "Waiting for VerticaDB CRD to be available..."
          for i in {1..30}; do
            kubectl get crd verticadbs.vertica.com && break
            echo "CRD not found yet. Retrying..."
            sleep 10
          done
          kubectl get crd verticadbs.vertica.com || (echo "VerticaDB CRD not found" && exit 1)

      # Step 7: Deploy VerticaDB
      - name: Deploy VerticaDB
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1beta1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            communal:
              path: "s3://dummy-bucket"
              credentials:
                accessKeyID: dummy
                secretAccessKey: dummy
            localDataPath: /data
            dbName: vdb
            subclusters:
              - name: defaultsubcluster
                size: 1
          EOF

      # Step 8: Wait for VerticaDB pod to be ready
      - name: Wait for VerticaDB pod
        run: |
          echo "Waiting for VerticaDB pod to be ready..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vertica \
            --namespace my-verticadb-operator --timeout=600s

      # Step 9: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          go test ./... -v
