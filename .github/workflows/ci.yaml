name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3

      # Step 3: Add Vertica Helm repo
      - name: Add Vertica Helm repo
        run: |
          for i in {1..3}; do
            helm repo add vertica-charts https://vertica.github.io/charts && break
            echo "Retrying helm repo add..."
            sleep 5
          done
          helm repo update

      # Step 4: Install Vertica Operator (includes CRDs)
      - name: Install Vertica Operator via Helm
        run: |
          helm install vdb-op vertica-charts/verticadb-operator \
            --namespace my-verticadb-operator \
            --create-namespace \
            --set installCRDs=true \
            --wait

      # Step 5: Wait for CRD registration to complete
      - name: Ensure Vertica CRD is available
        run: |
          echo "Waiting for VerticaDB CRD registration..."
          for i in {1..40}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              if kubectl api-resources --api-group=vertica.com | grep -q VerticaDB; then
                echo "✅ VerticaDB CRD is now registered and usable!"
                break
              fi
            fi
            echo "⏳ Still waiting for VerticaDB CRD to register... retry $i"
            sleep 5
          done
          kubectl api-resources --api-group=vertica.com | grep VerticaDB || (echo "❌ VerticaDB CRD not available!" && exit 1)

      # Step 6: Deploy VerticaDB
      - name: Deploy VerticaDB
        run: |
          # Create a fake secret for demo (normally you store real creds)
          kubectl -n my-verticadb-operator create secret generic communal-creds \
            --from-literal=AWS_ACCESS_KEY_ID=dummy \
            --from-literal=AWS_SECRET_ACCESS_KEY=dummy
            
          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            communal:
              path: "s3://dummy-bucket"
              credentialSecret: communal-creds
            local:
              dataPath: /data
            dbName: vdb
            subclusters:
              - name: defaultsubcluster
                size: 1
          EOF

      # Step 7: Wait for VerticaDB pod to be ready
      - name: Wait for VerticaDB pod
        run: |
          echo "Waiting for VerticaDB pod to be ready..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vertica \
            --namespace my-verticadb-operator --timeout=600s

      # Step 8: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          go test ./... -v
