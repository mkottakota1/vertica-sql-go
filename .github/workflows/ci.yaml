name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster (KinD)
      - name: Create KinD cluster
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-test
          wait: 120s

      # Step 2: Set up kubectl
      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: latest

      # Step 3: Verify cluster
      - name: Verify cluster
        run: kubectl get nodes -o wide

      # Step 4: Deploy VerticaDB Operator and CRDs
      - name: Deploy Vertica Operator
        run: |
          kubectl apply -f https://github.com/vertica/vertica-kubernetes/releases/latest/download/verticadb-operator.yaml
          kubectl rollout status deployment/verticadb-operator-controller-manager -n verticadb-operator --timeout=180s
          kubectl get pods -n verticadb-operator

      # Step 5: Deploy a sample VerticaDB
      - name: Deploy VerticaDB CR
        run: |
          kubectl apply -f https://github.com/vertica/vertica-kubernetes/releases/latest/download/verticadb-sample.yaml
          echo "Waiting for Vertica pods to become ready..."
          kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=vertica -n my-verticadb-operator --timeout=300s
          kubectl get pods -n my-verticadb-operator

      # Step 6: Verify Vertica service and endpoints
      - name: Verify Vertica service
        run: |
          kubectl -n my-verticadb-operator get svc
          kubectl -n my-verticadb-operator get endpoints

      # Step 7: Wait for DB service readiness
      - name: Wait for Vertica service endpoints
        run: |
          NS=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          echo "Waiting for ${SVC} endpoints..."
          for i in {1..60}; do
            addrs=$(kubectl -n ${NS} get endpoints ${SVC} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            [ -n "$addrs" ] && echo "Found endpoints: ${addrs}" && exit 0
            echo "No endpoints yet; retrying..."
            sleep 5
          done
          echo "ERROR: Service ${SVC} has no endpoints after waiting." && exit 1

      # Step 8: Verify TCP 5433 connectivity
      - name: Verify TCP 5433
        run: |
          NS=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          LOCATOR="${SVC}.${NS}.svc.cluster.local:5433"
          echo "Checking TCP connectivity to ${LOCATOR}..."
          kubectl -n ${NS} run --rm -i --restart=Never tmp-netcheck \
            --image=busybox -- /bin/sh -c "nc -z -w3 ${LOCATOR%%:*} ${LOCATOR##*:}"

      # Step 9: Build Vertica SQL Go (optional, if required before running tests)
      - name: Build Vertica SQL Go
        run: |
          go mod tidy
          go build ./...

      # ✅ Step 10: Run Vertica SQL Go tests inside cluster
      - name: Run Vertica SQL Go tests
        run: |
          NS=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          LOCATOR="${SVC}.${NS}.svc.cluster.local:5433"
          WAIT_TIMEOUT=300
          INTERVAL=5

          echo "Waiting for Service ${SVC} endpoints to be populated..."
          deadline=$((SECONDS + WAIT_TIMEOUT))
          while [ $SECONDS -lt $deadline ]; do
            addrs=$(kubectl -n ${NS} get endpoints ${SVC} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            if [ -n "$addrs" ]; then
              echo "Found endpoints: ${addrs}"
              break
            fi
            echo "no endpoints yet; sleeping ${INTERVAL}s"
            sleep ${INTERVAL}
          done

          if [ -z "$addrs" ]; then
            echo "ERROR: Service ${SVC} has no endpoints after ${WAIT_TIMEOUT}s"
            kubectl -n ${NS} get svc ${SVC} -o wide || true
            kubectl -n ${NS} get endpoints ${SVC} -o yaml || true
            exit 1
          fi

          echo "Probing TCP 5433 on service DNS ${LOCATOR}..."
          probe_ok=0
          deadline=$((SECONDS + WAIT_TIMEOUT))
          while [ $SECONDS -lt $deadline ]; do
            kubectl -n ${NS} run --rm -i --restart=Never tmp-netcheck \
              --image=busybox -- /bin/sh -c "nc -z -w3 ${LOCATOR%%:*} ${LOCATOR##*:}" && probe_ok=1 && break
            echo "TCP probe failed; retrying in ${INTERVAL}s"
            sleep ${INTERVAL}
          done

          if [ "${probe_ok}" != "1" ]; then
            echo "WARNING: TCP probe failed. Dumping diagnostics."
            kubectl -n ${NS} get endpoints ${SVC} -o yaml || true
            exit 1
          fi

          echo "✅ TCP 5433 reachable at ${LOCATOR}. Running Vertica SQL Go tests inside cluster..."

          # Create Go test runner pod
          kubectl -n ${NS} run go-test-runner \
            --image=golang:1.20 \
            --restart=Never -- sleep infinity
          kubectl -n ${NS} wait --for=condition=Ready pod/go-test-runner --timeout=120s

          # Copy Go source into pod
          echo "Copying Go source into pod..."
          kubectl -n ${NS} exec -i go-test-runner -- mkdir -p /workspace
          tar cf - . --warning=no-file-changed | kubectl -n ${NS} exec -i go-test-runner -- tar xf - -C /workspace

          # Run Go tests inside pod safely
          kubectl -n ${NS} exec -i go-test-runner -- bash -c '
            set -euo pipefail
            cd /workspace
            go mod tidy
            echo "Running main package tests..."
            go test -v -race . -args --locator '"${LOCATOR}"' --user dbadmin
            echo "Running all subpackage tests..."
            for pkg in $(go list ./... | grep -v "github.com/vertica/vertica-sql-go$"); do
              echo "===> $pkg"
              go test -v -race "$pkg"
            done
          '

          # Clean up pod
          kubectl -n ${NS} delete pod go-test-runner --ignore-not-found=true
