name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # Step 1: Checkout source
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 2: Create Kubernetes cluster (KinD)
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 3: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 4: Add Helm repositories
      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Step 5: Install MinIO for communal storage
      - name: Install MinIO (namespace minio)
        run: |
          kubectl create ns minio || true
          cat <<'EOF' > minio.yaml
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                  - name: minio
                    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
                    args: ["server", "/data"]
                    env:
                      - name: MINIO_ROOT_USER
                        value: "minio"
                      - name: MINIO_ROOT_PASSWORD
                        value: "miniopass"
                    ports:
                      - containerPort: 9000
                    volumeMounts:
                      - name: data
                        mountPath: /data
                volumes:
                  - name: data
                    emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: minio
          spec:
            selector:
              app: minio
            ports:
              - port: 9000
                targetPort: 9000
          EOF
          kubectl apply -f minio.yaml
          kubectl -n minio rollout status deployment/minio --timeout=2m || true
          kubectl get pods -n minio -o wide || true
          kubectl get svc -n minio || true

      # Step 6: Install Vertica Operator (configure S3 endpoint)
      - name: Install Vertica Operator (configure S3 endpoint)
        run: |
          NAMESPACE=my-verticadb-operator
          kubectl create ns ${NAMESPACE} || true
          cat <<'EOF' > operator-values.yaml
          installCRDs: true
          controller:
            extraEnv:
              - name: S3_ENDPOINT
                value: "http://minio.minio.svc.cluster.local:9000"
              - name: S3_USE_HTTPS
                value: "false"
              - name: S3_REGION
                value: "us-east-1"
              - name: S3_FORCE_PATH_STYLE
                value: "true"
          EOF
          helm upgrade --install vdb-op vertica-charts/verticadb-operator \
            -n ${NAMESPACE} -f operator-values.yaml --wait --timeout 10m
          kubectl -n ${NAMESPACE} get pods -o wide || true

      # Step 7: Create communal secret for Vertica
      - name: Create communal secret
        run: |
          NS=my-verticadb-operator
          kubectl create ns ${NS} || true
          echo "🧩 Creating communal credentials secret (for Vertica Operator)..."
          kubectl create secret generic communal-creds \
            -n ${NS} \
            --from-literal=accesskey=minio \
            --from-literal=secretkey=miniopass || true
          echo "✅ Communal secret created successfully."
          kubectl -n ${NS} get secret communal-creds -o yaml

      # Step 8: Deploy VerticaDB
      - name: Deploy VerticaDB
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://vertica-bucket"
              endpoint: "http://minio.minio.svc.cluster.local:9000"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

      # Step 9: Wait for Vertica Pod readiness
      - name: Wait for Vertica Pod readiness
        run: |
          kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=vertica --namespace=my-verticadb-operator --timeout=10m || true
          kubectl get pods -n my-verticadb-operator -o wide || true

      # Step 10: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          NS=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          LOCATOR="${SVC}.${NS}.svc.cluster.local:5433"
          WAIT_TIMEOUT=300
          INTERVAL=5

          echo "Waiting for Service ${SVC} endpoints to be populated..."
          deadline=$((SECONDS + WAIT_TIMEOUT))
          while [ $SECONDS -lt $deadline ]; do
            addrs=$(kubectl -n ${NS} get endpoints ${SVC} -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
            if [ -n "$addrs" ]; then
              echo "Found endpoints: ${addrs}"
              break
            fi
            echo "no endpoints yet; sleeping ${INTERVAL}s"
            sleep ${INTERVAL}
          done

          if [ -z "$addrs" ]; then
            echo "ERROR: Service ${SVC} has no endpoints after ${WAIT_TIMEOUT}s"
            kubectl -n ${NS} get svc ${SVC} -o wide || true
            kubectl -n ${NS} get endpoints ${SVC} -o yaml || true
            exit 1
          fi

          echo "Probing TCP 5433 on service DNS ${LOCATOR}..."
          probe_ok=0
          deadline=$((SECONDS + WAIT_TIMEOUT))
          while [ $SECONDS -lt $deadline ]; do
            kubectl -n ${NS} run --rm -i --restart=Never tmp-netcheck \
              --image=busybox -- /bin/sh -c "nc -z -w3 ${LOCATOR%%:*} ${LOCATOR##*:}" && probe_ok=1 && break
            echo "TCP probe failed; retrying in ${INTERVAL}s"
            sleep ${INTERVAL}
          done

          if [ "${probe_ok}" != "1" ]; then
            echo "WARNING: TCP probe failed. Dumping diagnostics."
            kubectl -n ${NS} get endpoints ${SVC} -o yaml || true
            exit 1
          fi

          echo "✅ TCP 5433 reachable at ${LOCATOR}. Running Vertica SQL Go tests inside cluster..."

          # Create Go test runner pod
          kubectl -n ${NS} run go-test-runner \
            --image=golang:1.20 \
            --restart=Never -- sleep infinity
          kubectl -n ${NS} wait --for=condition=Ready pod/go-test-runner --timeout=120s

          # Copy Go source into pod
          echo "Copying Go source into pod..."
          kubectl -n ${NS} exec -i go-test-runner -- mkdir -p /workspace
          tar cf - . --warning=no-file-changed | kubectl -n ${NS} exec -i go-test-runner -- tar xf - -C /workspace

          # Run Go tests inside pod safely
          kubectl -n ${NS} exec -i go-test-runner -- bash -c '
            set -euo pipefail
            cd /workspace
            go mod tidy
            echo "Running main package tests..."
            go test -v -race . -args --locator '"${LOCATOR}"' --user dbadmin
            echo "Running all subpackage tests..."
            for pkg in $(go list ./... | grep -v "github.com/vertica/vertica-sql-go$"); do
              echo "===> $pkg"
              go test -v -race "$pkg"
            done
          '

          # Clean up pod
          kubectl -n ${NS} delete pod go-test-runner --ignore-not-found=true

      # Step 11: Always collect debug info
      - name: Debug Vertica Pod and Operator State
        if: always()
        run: |
          echo "🔎 Collecting Vertica pod logs and describe output..."
          kubectl describe pod verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=300 || true
          kubectl get pods -n my-verticadb-operator -o wide || true
