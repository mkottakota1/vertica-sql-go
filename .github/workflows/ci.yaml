name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add Vertica Helm repo
      - name: Add Vertica Helm repo
        run: |
          for i in {1..3}; do
            helm repo add vertica-charts https://vertica.github.io/charts && break
            echo "Retrying helm repo add..."
            sleep 5
          done
          helm repo update

      # Step 4: Install Vertica Operator (includes CRDs)
      - name: Install Vertica Operator via Helm
        run: |
          echo "📦 Installing Vertica Operator via Helm..."
          helm install vdb-op vertica-charts/verticadb-operator \
            --namespace my-verticadb-operator \
            --create-namespace \
            --set installCRDs=true \
            --wait

      # Step 5: Wait for CRD registration to complete
      - name: Wait for Vertica CRD
        run: |
          echo "Waiting for VerticaDB CRD registration..."
          for i in {1..30}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              echo "✅ VerticaDB CRD is registered!"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 5
          done

      # Step 6: Deploy VerticaDB (Local mode with dummy communal)
      - name: Deploy VerticaDB
        run: |
          echo "🚀 Deploying VerticaDB (local mode with dummy communal path)..."
          kubectl -n my-verticadb-operator create secret generic communal-creds \
            --from-literal=AWS_ACCESS_KEY_ID=dummy \
            --from-literal=AWS_SECRET_ACCESS_KEY=dummy || true

          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://dummy-bucket"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

      # Step 7: Wait for VerticaDB pods to be Ready
      - name: Wait for VerticaDB pods to be ready
        run: |
          echo "⏳ Waiting for VerticaDB pods..."
          kubectl get pods -n my-verticadb-operator
          kubectl wait --for=condition=Ready pods --all \
            -n my-verticadb-operator --timeout=900s || {
              echo "⚠️ Pods not all ready, showing details:"
              kubectl get pods -n my-verticadb-operator -o wide
              kubectl describe pods -n my-verticadb-operator
            }
      # 🧩 Debug VerticaDB status after creation
      - name: Check VerticaDB Status
        run: |
          echo "🔍 Checking VerticaDB CR details..."
          kubectl get verticadb -n my-verticadb-operator -o yaml || true
          echo
          echo "📋 Describe VerticaDB:"
          kubectl describe verticadb verticadb-sample -n my-verticadb-operator || true
          echo
          echo "🐛 Operator Logs (last 100 lines):"
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=100 || true

      # Step 8: Wait for Vertica service before port-forwarding
      - name: Wait for Vertica service
        run: |
          echo "🔍 Waiting for Vertica service to appear..."
          for i in {1..30}; do
            if kubectl get svc verticadb-sample -n my-verticadb-operator >/dev/null 2>&1; then
              echo "✅ Vertica service found!"
              break
            fi
            echo "⏳ Service not yet created (attempt $i/30). Retrying..."
            sleep 10
          done

          if ! kubectl get svc verticadb-sample -n my-verticadb-operator >/dev/null 2>&1; then
            echo "❌ Vertica service never appeared. Showing debug info..."
            kubectl get svc -n my-verticadb-operator
            kubectl get pods -n my-verticadb-operator
            kubectl describe verticadb verticadb-sample -n my-verticadb-operator
            exit 1
          fi

      # Step 9: Port-forward Vertica service and wait for connection
      - name: Port-forward and wait for Vertica readiness
        run: |
          echo "🔌 Setting up port-forward to localhost:5433..."
          nohup kubectl port-forward svc/verticadb-sample-defaultsubcluster -n my-verticadb-operator 5433:5433 > port-forward.log 2>&1 &
          echo "🕓 Waiting 10 seconds for port-forward to start..."
          sleep 10

          echo "🧠 Checking if Vertica is accepting TCP connections on localhost:5433..."
          for i in {1..30}; do
            if nc -z localhost 5433; then
              echo "✅ Vertica is reachable on port 5433!"
            break
            fi
          echo "⏳ Vertica not ready yet (attempt $i/30). Retrying in 10s..."
          sleep 10
          done

      # Step 10: Verify Vertica DB is reachable and print version
      - name: Check Vertica Version
        run: |
          echo "🔍 Checking Vertica version inside Kubernetes..."
          POD_NAME=$(kubectl get pods -n my-verticadb-operator -l app.kubernetes.io/component=primary -o jsonpath='{.items[0].metadata.name}')
          echo "📦 Found Vertica pod: $POD_NAME"

          echo "🧠 Running version query..."
          kubectl exec -n my-verticadb-operator -it $POD_NAME -- bash -c "/opt/vertica/bin/vsql -U dbadmin -c 'SELECT version();'"


      # Step 10: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          echo "🧪 Running Go tests against Vertica..."
          go test ./... -v
