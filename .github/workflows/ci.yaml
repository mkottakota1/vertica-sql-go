name: Vertica SQL Go Build and Test (Local VerticaDB)

on:
  workflow_dispatch:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🧰 Checkout repo
        uses: actions/checkout@v4

      # Step 1: Set up local Kubernetes cluster
      - name: 🐳 Set up kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: vertica-kind
          wait: 120s

      # Step 2: Create namespace
      - name: 🏗️ Create vertica namespace
        run: kubectl create namespace vertica || true

      # Step 3: Install Vertica Operator and CRDs
      - name: 📦 Install Vertica Operator
        run: |
          echo "Applying Vertica CRD and Operator manifests..."
          kubectl apply -f https://github.com/vertica/vertica-kubernetes/releases/latest/download/verticadbs.vertica.com-crd.yaml
          kubectl apply -f https://github.com/vertica/vertica-kubernetes/releases/latest/download/verticadb-operator.yaml -n vertica
          echo "Waiting for Vertica operator deployment rollout..."
          kubectl rollout status deployment/verticadb-operator-controller-manager -n vertica --timeout=180s || true

      # Step 4: Wait for CRD registration to complete
      - name: Wait for Vertica CRD
        run: |
          echo "Waiting for VerticaDB CRD registration..."
          for i in {1..30}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              echo "✅ VerticaDB CRD is registered!"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 5
          done
          kubectl api-resources | grep vertica || echo "⚠️ CRD might not yet be listed!"

      # Step 5: Deploy VerticaDB (local-only, no S3)
      - name: 🚀 Deploy VerticaDB (local-only)
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: vertica
          spec:
            image: vertica/vertica-k8s:24.1.0
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://dummy"
              includeUIDInPath: false
            localData:
              path: "/home/db"
            subclusters:
              - name: main
                size: 1
                serviceType: ClusterIP
            volumes:
              - name: local-data
                emptyDir: {}
            volumeMounts:
              - name: local-data
                mountPath: /home/db
          EOF

      # Step 6: Wait until Vertica pod is ready
      - name: ⏳ Wait for Vertica pod readiness
        run: |
          echo "Waiting for Vertica pods to become ready..."
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vertica -n vertica --timeout=900s || {
            echo "❌ Vertica pod not ready, showing pod logs for debugging:"
            kubectl get pods -n vertica -o wide
            kubectl logs -n vertica -l app.kubernetes.io/name=vertica --tail=50 || true
            exit 1
          }
          kubectl get pods -n vertica -o wide

      # Step 7: Port-forward Vertica to localhost:5433
      - name: 🔌 Port-forward Vertica to localhost:5433
        run: |
          POD=$(kubectl get pod -n vertica -l app.kubernetes.io/name=vertica -o jsonpath='{.items[0].metadata.name}')
          kubectl port-forward $POD 5433:5433 -n vertica &
          sleep 25
          echo "Testing Vertica connectivity..."
          nc -zv localhost 5433 || {
            echo "❌ Vertica not reachable on port 5433"
            kubectl logs $POD -n vertica --tail=100 || true
            exit 1
          }

      # Step 8: Run Go unit tests against Vertica
      - name: 🧪 Run Vertica SQL Go tests
        env:
          VSQL_HOST: localhost
          VSQL_PORT: 5433
          VSQL_USER: dbadmin
          VSQL_PASSWORD: ""
          VSQL_DATABASE: vdb
        run: |
          echo "Running Go tests against Vertica..."
          go test ./... -v

      # Step 9: ✅ Finish
      - name: ✅ Done
        run: echo "Vertica deployed successfully and Go tests completed 🎉"
