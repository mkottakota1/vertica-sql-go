name: Vertica Operator Integration (kind)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: read

env:
  OP_IMAGE: ghcr.io/vertica/vertica-kubernetes/verticadb-operator:latest
  KIND_CLUSTER: vertica-kind
  K8S_NAMESPACE: vertica-test
  VDB_NAME: vdb-test
  VDB_DBNAME: vdbtls
  VERTICA_USER: release
  HOST_PORT: 5433

jobs:
  vertica-kind:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install prerequisites (kind, kubectl, tools)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq conntrack iptables netcat
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
          curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/

      - name: Authenticate to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Create kind cluster with port mapping for 5433
        run: |
          cat > kind-config.yaml <<EOF
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          nodes:
          - role: control-plane
            extraPortMappings:
            - containerPort: 30000
              hostPort: ${HOST_PORT}
              protocol: TCP
          EOF
          kind create cluster --name ${KIND_CLUSTER} --config=kind-config.yaml
          kubectl create namespace ${K8S_NAMESPACE} || true

      - name: Pull operator image and load into kind
        run: |
          docker pull ${OP_IMAGE}
          kind load docker-image ${OP_IMAGE} --name ${KIND_CLUSTER}

      - name: Deploy operator manifests (from vertica-kubernetes repo)
        run: |
          git clone https://github.com/vertica/vertica-kubernetes.git /tmp/vertica-k8s
          # Apply CRDs if present
          if [ -d /tmp/vertica-k8s/deploy/crds ]; then
            kubectl apply -f /tmp/vertica-k8s/deploy/crds -n ${K8S_NAMESPACE} || true
          fi
          # Apply RBAC and operator manifests (adjust path if repo layout differs)
          if [ -d /tmp/vertica-k8s/deploy/operator ]; then
            kubectl apply -f /tmp/vertica-k8s/deploy/operator -n ${K8S_NAMESPACE} || true
          fi
          # Patch operator deployment image to the pulled OP_IMAGE (best-effort)
          kubectl -n ${K8S_NAMESPACE} set image deployment/verticadb-operator verticadb-operator=${OP_IMAGE} --record || true
          kubectl -n ${K8S_NAMESPACE} rollout status deployment/verticadb-operator --timeout=120s || true

      - name: Wait for operator to become ready
        run: |
          for i in $(seq 1 60); do
            READY=$(kubectl -n ${K8S_NAMESPACE} get deploy verticadb-operator -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo 0)
            if [ "${READY}" = "1" ]; then
              echo "operator ready"
              break
            fi
            echo "waiting for operator (${i})..."
            sleep 5
          done
          kubectl -n ${K8S_NAMESPACE} get pods -o wide || true

      - name: Create Vertica superuser secret and apply VerticaDB CR
        env:
          VERTICA_DB_PASSWORD: ${{ secrets.VERTICA_DB_PASSWORD }}
        run: |
          kubectl -n ${K8S_NAMESPACE} create secret generic vdb-superuser-secret --from-literal=password="${VERTICA_DB_PASSWORD}" || true
          cat > /tmp/verticadb-cr.yaml <<EOF
          apiVersion: vertica.com/v1beta1
          kind: VerticaDB
          metadata:
            name: ${VDB_NAME}
            namespace: ${K8S_NAMESPACE}
          spec:
            image: "vertica/vertica:latest"
            size: 1
            dbName: ${VDB_DBNAME}
            superuserPasswordSecret:
              name: vdb-superuser-secret
              key: password
          EOF
          kubectl apply -f /tmp/verticadb-cr.yaml -n ${K8S_NAMESPACE}

      - name: Wait for Vertica pod and localhost:5433 to be reachable
        run: |
          # Wait for pod to appear and become Running
          for i in $(seq 1 120); do
            POD=$(kubectl -n ${K8S_NAMESPACE} get pods -o jsonpath='{.items[0].metadata.name}' --ignore-not-found)
            if [ -n "${POD}" ]; then
              STATUS=$(kubectl -n ${K8S_NAMESPACE} get pod ${POD} -o jsonpath='{.status.phase}')
              echo "pod ${POD} status ${STATUS}"
              if [ "${STATUS}" = "Running" ]; then
                break
              fi
            fi
            sleep 5
          done
          # Confirm host port mapping is reachable
          for i in $(seq 1 60); do
            if nc -z localhost ${HOST_PORT}; then
              echo "localhost:${HOST_PORT} reachable"
              break
            fi
            echo "waiting for localhost:${HOST_PORT} ..."
            sleep 3
          done

      - name: Create test user inside Vertica
        env:
          VERTICA_TEST_USER_PASSWORD: ${{ secrets.VERTICA_TEST_USER_PASSWORD }}
        run: |
          POD=$(kubectl -n ${K8S_NAMESPACE} get pods -l app.kubernetes.io/name=verticadb -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -z "${POD}" ]; then
            POD=$(kubectl -n ${K8S_NAMESPACE} get pods -o jsonpath='{.items[0].metadata.name}')
          fi
          echo "Using pod: ${POD}"
          kubectl -n ${K8S_NAMESPACE} exec -i ${POD} -- /opt/vertica/bin/vsql -U dbadmin -w "${{ secrets.VERTICA_DB_PASSWORD }}" -c "CREATE USER IF NOT EXISTS ${VERTICA_USER} IDENTIFIED BY '${VERTICA_TEST_USER_PASSWORD}'; GRANT ALL ON SCHEMA public TO ${VERTICA_USER};" || true

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Go tests against in-cluster DB
        env:
          VERTICA_HOST: localhost
          VERTICA_PORT: ${HOST_PORT}
          VERTICA_DATABASE: ${VDB_DBNAME}
          VERTICA_USER: ${VERTICA_USER}
          VERTICA_PASSWORD: ${{ secrets.VERTICA_TEST_USER_PASSWORD }}
        run: |
          go test -v ./... -args --locator localhost:${HOST_PORT} --user ${VERTICA_USER} --password "${VERTICA_PASSWORD}" --tlsmode none

      - name: Collect logs on failure
        if: failure()
        run: |
          kubectl -n ${K8S_NAMESPACE} get pods -o wide || true
          kubectl -n ${K8S_NAMESPACE} logs -l app.kubernetes.io/name=verticadb --all-containers || true
          docker ps -a || true

      - name: Tear down kind cluster
        if: always()
        run: |
          kind delete cluster --name ${KIND_CLUSTER}
