name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add Helm repos
      - name: Add Helm repos
        run: |
          for i in {1..3}; do
            helm repo add vertica-charts https://vertica.github.io/charts && break
            echo "Retrying vertica helm repo add..."
            sleep 5
          done
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Step 4: Install Vertica Operator (includes CRDs)
      - name: Install Vertica Operator via Helm
        run: |
          echo "📦 Installing Vertica Operator via Helm..."
          helm install vdb-op vertica-charts/verticadb-operator \
            --namespace my-verticadb-operator \
            --create-namespace \
            --set installCRDs=true \
            --wait

      # Step 5: Wait for CRD registration to complete
      - name: Wait for Vertica CRD
        run: |
          echo "Waiting for VerticaDB CRD registration..."
          for i in {1..30}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              echo "✅ VerticaDB CRD is registered!"
              break
            fi
            echo "⏳ Waiting... ($i/30)"
            sleep 5
          done

      # NEW: Step 5.1 Install MinIO (S3 compatible) for communal storage
      - name: Install MinIO (Bitnami) and wait
        run: |
          NAMESPACE=minio
          RELEASE=minio
          ACCESS_KEY=minio
          SECRET_KEY=miniopass

          echo "Installing MinIO in namespace $NAMESPACE..."
          helm upgrade --install $RELEASE bitnami/minio \
            --namespace $NAMESPACE --create-namespace \
            --wait \
            --set auth.rootUser=$ACCESS_KEY \
            --set auth.rootPassword=$SECRET_KEY \
            --set service.type=ClusterIP

          # wait for minio pod ready
          for i in {1..30}; do
            if kubectl get pods -n $NAMESPACE -l app.kubernetes.io/name=minio -o jsonpath='{.items[0].status.phase}' 2>/dev/null | grep -q Running; then
              echo "✅ MinIO is running"
              break
            fi
            echo "Waiting for MinIO to be Running ($i/30)..."
            sleep 5
          done

      # NEW: Step 5.2 Create communal secret and optional bucket
      - name: Create communal secret and create bucket
        run: |
          VERTICA_NS=my-verticadb-operator
          MINIO_NS=minio
          MINIO_SVC=minio
          ACCESS_KEY=minio
          SECRET_KEY=miniopass
          BUCKET=vertica-bucket

          echo "Creating secret with MinIO creds in $VERTICA_NS..."
          kubectl create secret generic communal-creds -n $VERTICA_NS \
            --from-literal=AWS_ACCESS_KEY_ID=${ACCESS_KEY} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${SECRET_KEY} || true

          echo "Creating bucket '${BUCKET}' in MinIO (using mc inside minio pod)..."
          # Create a bucket using the MinIO client (mc). If mc not available, use aws cli alternative or skip.
          POD=$(kubectl get pods -n ${MINIO_NS} -l app.kubernetes.io/name=minio -o name | head -n1 | sed 's|pod/||')
          if [ -n "$POD" ]; then
            # use embedded mc if chart provides it; otherwise use a simple curl health check and let Vertica create the bucket
            kubectl exec -n ${MINIO_NS} ${POD} -- /bin/sh -c "mc --help" >/dev/null 2>&1 && \
              kubectl exec -n ${MINIO_NS} ${POD} -- /bin/sh -c "mc alias set local http://127.0.0.1:9000 ${ACCESS_KEY} ${SECRET_KEY} && mc mb --ignore-existing local/${BUCKET}" || \
              echo "mc not available in MinIO pod; skip bucket creation and let Vertica create the bucket on first use"
          else
            echo "No MinIO pod found; skipping bucket creation"
          fi

      # Step 6: Deploy VerticaDB (point communal to MinIO)
      - name: Deploy VerticaDB
        run: |
          echo "🚀 Deploying VerticaDB (communal -> MinIO)..."
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              # Use in-cluster MinIO service DNS; include port 9000 and a bucket
              path: "s3://vertica-bucket"
              # For non-AWS endpoints the operator usually looks for S3_ENDPOINT via env or config;
              # the Vertica operator may accept an S3 endpoint in annotations or require extra config.
              # If operator supports custom endpoint via environment, set it in the Helm chart values when installing the operator.
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

      # Step 7: Wait for VerticaDB pods to be Ready
      - name: Wait for VerticaDB pods to be ready
        run: |
          echo "⏳ Waiting for VerticaDB pods..."
          kubectl get pods -n my-verticadb-operator
          kubectl wait --for=condition=Ready pods --all \
            -n my-verticadb-operator --timeout=900s || {
              echo "⚠️ Pods not all ready, showing details:"
              kubectl get pods -n my-verticadb-operator -o wide
              kubectl describe pods -n my-verticadb-operator
            }

      # 🧩 Debug VerticaDB status after creation
      - name: Check VerticaDB Status
        run: |
          echo "🔍 Checking VerticaDB CR details..."
          kubectl get verticadb -n my-verticadb-operator -o yaml || true
          echo
          echo "📋 Describe VerticaDB:"
          kubectl describe verticadb verticadb-sample -n my-verticadb-operator || true
          echo
          echo "🐛 Operator Logs (last 100 lines):"
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=100 || true

      # Step 8: Wait for Vertica service before port-forwarding
      - name: Wait for Vertica service
        run: |
          echo "🔍 Waiting for Vertica service to appear..."
          for i in {1..30}; do
            if kubectl get svc verticadb-sample -n my-verticadb-operator >/dev/null 2>&1; then
              echo "✅ Vertica service found!"
              break
            fi
            echo "⏳ Service not yet created (attempt $i/30). Retrying..."
            sleep 10
          done

          if ! kubectl get svc verticadb-sample -n my-verticadb-operator >/dev/null 2>&1; then
            echo "❌ Vertica service never appeared. Showing debug info..."
            kubectl get svc -n my-verticadb-operator
            kubectl get pods -n my-verticadb-operator
            kubectl describe verticadb verticadb-sample -n my-verticadb-operator
            exit 1
          fi

      # Step 9: Port-forward Vertica service and wait for connection
      - name: Port-forward and wait for Vertica readiness
        run: |
          NAMESPACE=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          LOCAL_PORT=5433
          REMOTE_PORT=5433

          echo "🔍 Confirming service exists..."
          if ! kubectl get svc "$SVC" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "❌ Service $SVC not found in namespace $NAMESPACE"
            kubectl get svc -n "$NAMESPACE" || true
            exit 1
          fi

          echo "🔌 Starting port-forward to localhost:$LOCAL_PORT..."
          nohup kubectl port-forward svc/"$SVC" -n "$NAMESPACE" $LOCAL_PORT:$REMOTE_PORT > port-forward.log 2>&1 &

          PF_PID=$!
          echo "port-forward PID: $PF_PID"
          sleep 3

          echo "🧠 Waiting for TCP connectivity on localhost:$LOCAL_PORT..."
          for i in {1..30}; do
            if nc -z localhost $LOCAL_PORT; then
              echo "✅ Vertica reachable on port $LOCAL_PORT"
              break
            fi
            echo "⏳ Not reachable yet (attempt $i/30). Sleeping 10s..."
            sleep 10
          done

          if ! nc -z localhost $LOCAL_PORT; then
            echo "❌ Timeout waiting for localhost:$LOCAL_PORT. Showing debug:"
            tail -n +1 port-forward.log || true
            kubectl get pods -n "$NAMESPACE" -o wide || true
            kubectl describe verticadb verticadb-sample -n "$NAMESPACE" || true
            kill $PF_PID || true
            exit 1
          fi

      # Step 10: Verify Vertica DB is reachable and print version
      - name: Check Vertica Version
        run: |
          echo "🔍 Checking Vertica version inside Kubernetes..."
          POD_NAME=$(kubectl get pods -n my-verticadb-operator -l app.kubernetes.io/component=primary -o name | head -n1 | sed 's|pod/||')
          if [ -z "$POD_NAME" ]; then
            echo "❌ No primary pod found; dumping pods:"
            kubectl get pods -n my-verticadb-operator -o wide
            exit 1
          fi
          echo "📦 Found Vertica pod: $POD_NAME"

          echo "🧠 Running version query..."
          kubectl exec -n my-verticadb-operator -it $POD_NAME -- bash -c "/opt/vertica/bin/vsql -U dbadmin -c 'SELECT version();'"

      # Step 11: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          echo "🧪 Running Go tests against Vertica..."
          go test ./... -v
