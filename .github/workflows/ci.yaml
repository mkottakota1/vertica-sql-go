name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3

      # Step 3: Add Vertica Helm repo
      - name: Add Vertica Helm repo
        run: |
          for i in {1..3}; do
            helm repo add vertica-charts https://vertica.github.io/charts && break
            echo "Retrying helm repo add..."
            sleep 5
          done
          helm repo update

      # Step 4: Install Vertica Operator (includes CRDs)
      - name: Install Vertica Operator via Helm
        run: |
          helm install vdb-op vertica-charts/verticadb-operator \
            --namespace my-verticadb-operator \
            --create-namespace \
            --set installCRDs=true \
            --wait

      # Step 5: Wait for CRD registration to complete
      - name: Ensure Vertica CRD is available
        run: |
          echo "Waiting for VerticaDB CRD registration..."
          for i in {1..40}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              if kubectl api-resources --api-group=vertica.com | grep -q VerticaDB; then
                echo "✅ VerticaDB CRD is now registered and usable!"
                break
              fi
            fi
            echo "⏳ Still waiting for VerticaDB CRD to register... retry $i"
            sleep 5
          done
          kubectl api-resources --api-group=vertica.com | grep VerticaDB || (echo "❌ VerticaDB CRD not available!" && exit 1)

      # Step 6: Ensure a default storage class exists (fixed 404)
      - name: Ensure default storage class
        run: |
          echo "📦 Ensuring a default storage class exists..."
          cat <<EOF | kubectl apply -f -
          apiVersion: storage.k8s.io/v1
          kind: StorageClass
          metadata:
            name: standard
            annotations:
              storageclass.kubernetes.io/is-default-class: "true"
          provisioner: kubernetes.io/no-provisioner
          volumeBindingMode: WaitForFirstConsumer
          EOF
          kubectl get storageclass

      # Step 7: Deploy VerticaDB
      - name: Deploy VerticaDB
        run: |
          echo "🚀 Deploying VerticaDB (local-only mode)..."

          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            dbName: vdb
            image: opentext/vertica-k8s:24.2.0-0
            imagePullPolicy: Always
            initPolicy: CreateSkipCommunal
            local:
              dataPath: /data
            subclusters:
              - name: defaultsubcluster
                size: 3
                type: primary
                serviceType: ClusterIP
            serviceClientPort: 5433
            serviceHTTPSPort: 8443
          EOF

      # Step 8: Wait for VerticaDB pod(s) to be ready
      - name: Wait for VerticaDB pod(s)
        run: |
          echo "⏳ Waiting for VerticaDB pods to be created..."
          for i in {1..60}; do
            POD_COUNT=$(kubectl get pods -n my-verticadb-operator --no-headers 2>/dev/null | grep verticadb-sample | wc -l || true)
            if [ "$POD_COUNT" -gt 0 ]; then
              echo "✅ VerticaDB pods detected ($POD_COUNT). Proceeding to readiness check..."
              kubectl get pods -n my-verticadb-operator
              break
            fi
            echo "⏳ No VerticaDB pods yet (attempt $i/60). Retrying in 10s..."
            sleep 10
          done

          echo "🕒 Waiting for VerticaDB pods to become ready..."
          if ! kubectl wait --for=condition=Ready pod -l app.kubernetes.io/name=vertica \
            -n my-verticadb-operator --timeout=900s 2>/dev/null; then
            echo "⚠️ Label selector 'app.kubernetes.io/name=vertica' didn't match. Falling back..."
            kubectl wait --for=condition=Ready pods --all -n my-verticadb-operator --timeout=900s || true
          fi
          echo "✅ VerticaDB pods are ready!"

      # ✅ Step 9: Verify Vertica service, port-forward, and confirm accessibility
      - name: Verify Vertica service availability
        run: |
          echo "🔍 Checking Vertica service..."
          kubectl get svc -n my-verticadb-operator
          echo "🔌 Port-forwarding Vertica service to localhost:5433..."
          kubectl port-forward svc/verticadb-sample -n my-verticadb-operator 5433:5433 &
          sleep 15
          echo "🧠 Checking if Vertica is accepting connections..."
          for i in {1..20}; do
            if nc -zv localhost 5433; then
              echo "✅ Vertica is accessible at localhost:5433"
              break
            fi
            echo "⏳ Vertica not yet ready (attempt $i/20)..."
            sleep 10
          done

          if ! nc -zv localhost 5433; then
            echo "❌ Vertica not accessible after waiting."
            kubectl get pods -n my-verticadb-operator
            kubectl logs -n my-verticadb-operator -l app.kubernetes.io/name=vertica || true
            exit 1
          fi

      # ✅ Step 10: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          echo "🏁 Running Vertica SQL Go tests against localhost:5433"
          go test ./... -v
