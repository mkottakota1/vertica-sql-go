name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Add Vertica Helm repo (with retries)
        run: |
          for i in {1..3}; do
            helm repo add vertica-charts https://vertica.github.io/charts && break
            echo "Retrying helm repo add..."
            sleep 5
          done
          helm repo update

      - name: Create namespace
        run: kubectl create namespace my-verticadb-operator || true

      - name: Install Vertica Operator
        run: |
          for i in {1..3}; do
            helm install vdb-op --wait --namespace my-verticadb-operator vertica-charts/verticadb-operator && break
            echo "Retrying Helm install for Vertica operator..."
            sleep 10
          done

      - name: Wait for Vertica operator pod to be ready
        run: |
          kubectl wait --for=condition=ready pod -n my-verticadb-operator \
            -l app.kubernetes.io/name=verticadb-operator --timeout=300s

      - name: Install Vertica Database (single node)
        run: |
          helm install vertica-db vertica-charts/vertica-k8s \
            --namespace my-verticadb-operator \
            --set image.repository=opentext/vertica-k8s \
            --set image.tag=latest \
            --set data.path=/data \
            --set database.name=verticadb \
            --set database.nodes=1

      - name: Wait for Vertica DB pod to be ready
        run: |
          kubectl wait --for=condition=ready pod -n my-verticadb-operator \
            -l app.kubernetes.io/name=vertica-k8s --timeout=600s

      - name: Run Vertica SQL Go tests
        run: |
          go test ./... -v
