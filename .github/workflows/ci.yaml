name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # KinD
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Install MinIO suitable for KinD (ephemeral)
      - name: Install MinIO (Bitnami) with no persistence
        run: |
          NAMESPACE=minio
          RELEASE=minio
          ACCESS_KEY=minio
          SECRET_KEY=miniopass

          helm upgrade --install ${RELEASE} bitnami/minio \
            --namespace ${NAMESPACE} --create-namespace \
            --wait --timeout 10m \
            --set auth.rootUser=${ACCESS_KEY} \
            --set auth.rootPassword=${SECRET_KEY} \
            --set persistence.enabled=false \
            --set replicaCount=1 \
            --set service.type=ClusterIP

          # wait for pod Running
          for i in {1..30}; do
            POD=$(kubectl get pods -n ${NAMESPACE} -l app.kubernetes.io/name=minio -o name 2>/dev/null | head -n1 || true)
            if [ -n "$POD" ] && kubectl get ${POD} -n ${NAMESPACE} -o jsonpath='{.status.phase}' 2>/dev/null | grep -q Running; then
              echo "MinIO Running"
              break
            fi
            echo "Waiting for MinIO ($i/30)..."
            sleep 5
          done

          kubectl get pods -n ${NAMESPACE} -o wide || true
          kubectl get svc -n ${NAMESPACE} || true

      # Install Vertica Operator (opentext image) with S3 endpoint configured
      - name: Install Vertica Operator (opentext image) with S3 endpoint config
        run: |
          RELEASE=vdb-op
          NAMESPACE=my-verticadb-operator
          IMAGE_REPO=opentext/verticadb-operator
          IMAGE_TAG=latest
          MINIO_ENDPOINT=http://minio.minio.svc.cluster.local:9000
          S3_REGION=us-east-1

          cat <<EOF > operator-values.yaml
          installCRDs: true
          image:
            repository: ${IMAGE_REPO}
            tag: ${IMAGE_TAG}
          # Provide envs to controller/manager so it uses our MinIO endpoint.
          # These keys may vary by chart version; common names are controller.extraEnv or controller.env.
          controller:
            extraEnv:
              - name: S3_ENDPOINT
                value: "${MINIO_ENDPOINT}"
              - name: S3_REGION
                value: "${S3_REGION}"
              - name: S3_USE_HTTPS
                value: "false"
          EOF

          # Use helm to install with our values file (long timeout for CI)
          helm upgrade --install ${RELEASE} vertica-charts/verticadb-operator \
            --namespace ${NAMESPACE} --create-namespace \
            -f operator-values.yaml \
            --wait --timeout 10m

          # quick check
          kubectl get pods -n ${NAMESPACE} -o wide || true
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=50 || true

      # Create communal secret in Vertica namespace with MinIO creds
      - name: Create communal secret for Vertica
        run: |
          VERTICA_NS=my-verticadb-operator
          ACCESS_KEY=minio
          SECRET_KEY=miniopass

          kubectl create ns ${VERTICA_NS} || true
          kubectl create secret generic communal-creds -n ${VERTICA_NS} \
            --from-literal=AWS_ACCESS_KEY_ID=${ACCESS_KEY} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${SECRET_KEY} || true

          kubectl get secret communal-creds -n ${VERTICA_NS} -o yaml || true

      # Deploy VerticaDB pointing communal to MinIO
      - name: Deploy VerticaDB (communal -> MinIO)
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: "s3://vertica-bucket"
              credentialSecret: communal-creds
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

      # Wait for Vertica resources
      - name: Wait for VerticaCRD and pods
        run: |
          for i in {1..30}; do
            if kubectl get crd verticadbs.vertica.com >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          kubectl get pods -n my-verticadb-operator || true
          kubectl wait --for=condition=Ready pods --all -n my-verticadb-operator --timeout=900s || {
            echo "Pods not all ready; dumping details..."
            kubectl get pods -n my-verticadb-operator -o wide || true
            kubectl describe pods -n my-verticadb-operator || true
          }

      # Debug and checks
      - name: Check VerticaDB CR and operator logs
        run: |
          kubectl get verticadb -n my-verticadb-operator -o yaml || true
          kubectl describe verticadb verticadb-sample -n my-verticadb-operator || true
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=200 || true

      # Port-forward and test as before...
      - name: Port-forward and wait for Vertica readiness
        run: |
          NAMESPACE=my-verticadb-operator
          SVC=verticadb-sample-defaultsubcluster
          LOCAL_PORT=5433
          REMOTE_PORT=5433

          if ! kubectl get svc "$SVC" -n "$NAMESPACE" >/dev/null 2>&1; then
            echo "Service $SVC not found; listing services:"
            kubectl get svc -n "$NAMESPACE" || true
            exit 1
          fi

          nohup kubectl port-forward svc/"$SVC" -n "$NAMESPACE" $LOCAL_PORT:$REMOTE_PORT > port-forward.log 2>&1 &
          PF_PID=$!
          sleep 3

          for i in {1..30}; do
            if nc -z localhost $LOCAL_PORT; then
              echo "Vertica reachable"
              break
            fi
            sleep 5
          done

          if ! nc -z localhost $LOCAL_PORT; then
            echo "Port-forward failed; printing logs"
            tail -n +1 port-forward.log || true
            kubectl get pods -n "$NAMESPACE" -o wide || true
            exit 1
          fi

      - name: Check Vertica Version
        run: |
          POD_NAME=$(kubectl get pods -n my-verticadb-operator -l app.kubernetes.io/component=primary -o name | head -n1 | sed 's|pod/||')
          if [ -z "$POD_NAME" ]; then
            kubectl get pods -n my-verticadb-operator -o wide
            exit 1
          fi
          kubectl exec -n my-verticadb-operator -it $POD_NAME -- bash -c "/opt/vertica/bin/vsql -U dbadmin -c 'SELECT version();'"

      - name: Run Vertica SQL Go tests
        run: |
          go test ./... -v
