name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Step 1: Create Kubernetes cluster (KinD)
      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      # Step 2: Set up Helm
      - name: Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: "3.11.3"

      # Step 3: Add Helm repositories
      - name: Add Helm repos
        run: |
          helm repo add vertica-charts https://vertica.github.io/charts || true
          helm repo add bitnami https://charts.bitnami.com/bitnami || true
          helm repo update

      # Step 4: Install Vertica Operator (AWS S3 mode)
      - name: Install Vertica Operator
        run: |
          NAMESPACE=my-verticadb-operator
          kubectl create ns ${NAMESPACE} || true

          cat <<'EOF' > operator-values.yaml
          installCRDs: true
          controller:
            extraEnv:
              - name: AWS_REGION
                value: "us-east-1"
              - name: AWS_DEFAULT_REGION
                value: "us-east-1"
          EOF

          helm upgrade --install vdb-op vertica-charts/verticadb-operator \
            -n ${NAMESPACE} -f operator-values.yaml --wait --timeout 10m

          kubectl -n ${NAMESPACE} get pods -o wide || true
          kubectl logs -n ${NAMESPACE} -l control-plane=controller-manager --tail=100 || true

      # Step 5: Create AWS S3 secret
      - name: Create communal secret for AWS S3
        run: |
          kubectl create secret generic communal-creds \
            -n my-verticadb-operator \
            --from-literal=AWS_ACCESS_KEY_ID= ${{ secrets.AWS_ACCESS_KEY_ID }} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} || true

          kubectl get secret communal-creds -n my-verticadb-operator -o yaml || true

      - name: Test AWS S3 access
        run: |
          kubectl run s3-test --rm -i --restart=Never \
          --image=amazon/aws-cli \
          --namespace=my-verticadb-operator \
          --env AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
          --env AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
          -- aws s3 ls s3:vertica-fleeting/mkottakota --region us-east-1

      # Step 6: Deploy VerticaDB (using AWS S3)
      - name: Deploy VerticaDB
        run: |
          cat <<'EOF' | kubectl apply -f -
          apiVersion: vertica.com/v1
          kind: VerticaDB
          metadata:
            name: verticadb-sample
            namespace: my-verticadb-operator
          spec:
            image: opentext/vertica-k8s:latest
            dbName: vdb
            initPolicy: Create
            communal:
              path: s3://vertica-fleeting/mkottakota
              credentialSecret: communal-creds
              region: us-east-1
            local:
              dataPath: /data
              depotPath: /depot
            subclusters:
              - name: defaultsubcluster
                size: 3
          EOF

          kubectl annotate verticadb verticadb-sample -n my-verticadb-operator \
            vertica.com/ci-reconcile="$(date -u +%s)" --overwrite || true

      # Step 7: Wait for Vertica readiness
      - name: Wait for Vertica Operator and Pod readiness
        run: |
          NS=my-verticadb-operator
          SS=verticadb-sample-defaultsubcluster
          POD=${SS}-0

          echo "🕓 Waiting for Vertica StatefulSet..."
          for i in {1..30}; do
            if kubectl get pod ${POD} -n ${NS} >/dev/null 2>&1; then
              echo "✅ Pod exists"
              break
            fi
            sleep 10
          done

          kubectl wait --for=condition=Ready pod/${POD} -n ${NS} --timeout=5m || true
          kubectl get pods -n ${NS} -o wide || true

      # Step 8: Debug Vertica pod if failure occurs
      - name: Debug Vertica Pod State
        if: always()
        run: |
          echo "🔎 Collecting Vertica logs and describe output..."
          kubectl describe pod verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=200 || true
          echo "🔍 Testing AWS S3 connectivity..."
          kubectl run s3-test --rm -i --restart=Never \
            --image=amazon/aws-cli -n my-verticadb-operator -- \
            s3 ls s3://vgarg/10/ --region us-east-1 || true

      # Step 9: Run Vertica SQL Go tests
      - name: Run Vertica SQL Go tests
        run: |
          kubectl run go-test-runner \
            --rm -i --restart=Never \
            --image=golang:1.20 \
            --namespace=my-verticadb-operator \
            -- bash -c "$(cat <<'EOS'
          set -e
          git clone https://github.com/mkottakota1/vertica-sql-go /src || true
          cd /src || true
          go test ./... -v -args \
            --locator verticadb-sample-defaultsubcluster.my-verticadb-operator.svc.cluster.local:5433 \
            --user dbadmin
          EOS
          )"

      # Step 10: Final Diagnostics
      - name: Save final diagnostics
        if: always()
        run: |
          kubectl get pods -n my-verticadb-operator -o wide || true
          kubectl get svc -n my-verticadb-operator -o wide || true
          kubectl get endpoints -n my-verticadb-operator || true
          kubectl logs -n my-verticadb-operator -l control-plane=controller-manager --tail=500 || true
          kubectl logs verticadb-sample-defaultsubcluster-0 -n my-verticadb-operator --all-containers --tail=500 || true
