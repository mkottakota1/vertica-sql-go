name: Vertica SQL Go Build and Test

on:
  push:
    branches: [ main, vertica-buildsetup ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Kubernetes (KinD)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: vertica-ci
          node_image: kindest/node:v1.29.0

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Add Vertica Helm repo
        run: |
          for i in {1..3}; do
            helm repo add vertica https://vertica.github.io/charts && break
            echo "Retrying helm repo add..."
            sleep 5
          done
          helm repo update

      - name: Install Vertica using Helm
        run: |
          helm install vertica-db vertica/vertica-k8s \
            --set image.repository=opentext/vertica-k8s \
            --set image.tag=latest \
            --set license.secretName=license-secret \
            --set data.path=/data \
            --set database.name=verticadb \
            --set database.nodes=1

      - name: Wait for Vertica pod to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=vertica-k8s --timeout=300s

      - name: Run Vertica SQL Go tests
        run: |
          go test ./... -v
